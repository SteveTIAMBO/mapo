    <meta charset="UTF-8" />
    <!-- Hôte retiré : miapo.app-edufrem.com → mapoplus.app-edufrem.com (2026-08-03).
         En TÊTE du head et en script classique : il part avant tout le reste, donc
         avant la détection de tenant, qui ne connaît plus « miapo » et le prendrait
         sinon pour le sous-domaine d'une école. Chemin, query et fragment conservés.
         À supprimer le jour où le sous-domaine sera retiré du serveur. -->
    <script>
      if (location.hostname === 'miapo.app-edufrem.com') {
        location.replace('https://mapoplus.app-edufrem.com' + location.pathname + location.search + location.hash)
      }
    </script>

    <!-- Hôte retiré : miapo.app-edufrem.com → mapoplus.app-edufrem.com.

      if (location.hostname === 'miapo.app-edufrem.com') {
