name: Déploiement MAPO → LWS (cPanel)

# Déclenché à chaque push sur main, ou manuellement depuis l'onglet Actions.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        # --legacy-peer-deps : vite-plugin-pwa déclare un peer vite ≤7 alors que
        # le projet est en vite 8 (compatible en pratique). Évite l'échec ERESOLVE.
        run: npm ci --legacy-peer-deps

      - name: Build (Vite → /tmp/mapo-build)
        run: npm run build

      # On assemble le paquet à déployer : la SPA construite + les proxies PHP.
      # ⚠️ On N'INCLUT PAS les fichiers *-config.php ni mapo-sa-key.json :
      # ils contiennent les clés API et vivent UNIQUEMENT sur le serveur.
      - name: Assembler le paquet
        run: |
          mkdir -p deploy_payload
          cp -R /tmp/mapo-build/* deploy_payload/
          for f in mapo-ia.php mapo-pay.php mapo-notify.php mapo-provision.php mapo-sign.php; do
            [ -f "server/$f" ] && cp "server/$f" "deploy_payload/$f" || true
          done
          rm -f deploy_payload/*.map

      - name: Déployer par FTP vers le dossier mapo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # ⚠️ Hôte = le SERVEUR LWS réel (Pure-FTPd, port 21 ouvert, TLS),
          # PAS `ftp.app-edufrem.com` (qui pointe vers le front applicatif GCP
          # 35.240.x où le port 21 est fermé → « Timeout (control socket) »).
          # web58.lws-hosting.com est un nom DNS public, pas un secret.
          server: web58.lws-hosting.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # LWS exige le FTPS explicite (FTP over TLS) sur le port 21.
          protocol: ftps
          port: 21
          # Le compte FTP `deploy@` DOIT être enraciné sur le dossier SERVI
          # public_html/app-edufrem.com/mapo (et non le voisin `mapoFTP`).
          # Le compte étant cloisonné à sa racine, on dépose à `./`.
          local-dir: ./deploy_payload/
          server-dir: ./
          # Sécurité : ne JAMAIS téléverser/écraser les configs ni les secrets.
          exclude: |
            **/*-config.php
            **/mapo-sa-key.json
            **/.git*
            **/.ftp-deploy-sync-state.json
