# Règles Firestore — vérifiées à chaque poussée.
#
# Fichier SÉPARÉ de deploy.yml, volontairement : un échec ici ne doit pas
# empêcher un déploiement, et une erreur de ma part ici ne doit pas pouvoir
# casser la mise en production.
#
# Ces règles décident qui voit et qui modifie les données d'un enfant mineur.
# Le simulateur de la console Firebase n'existe plus : l'émulateur est désormais
# le seul moyen de les tester. Sans ce workflow, elles ne seraient vérifiées que
# lorsque quelqu'un y pense.
name: Règles Firestore

on:
  push:
    paths:
      - 'firestore.rules'
      - 'tests/regles-firestore.test.js'
      - '.github/workflows/regles.yml'
  workflow_dispatch:

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:rules
