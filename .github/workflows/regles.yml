# Règles Firestore — vérifiées à chaque poussée.
#
# Fichier SÉPARÉ de deploy.yml, volontairement : un échec ici ne doit pas
# empêcher un déploiement, et une erreur de ma part ici ne doit pas pouvoir
# casser la mise en production.
#
# Ces règles décident qui voit et qui modifie les données d'un enfant mineur.
# Le simulateur de la console Firebase n'existe plus : l'émulateur est désormais
# le seul moyen de les tester. Sans ce workflow, elles ne seraient vérifiées que
# lorsque quelqu'un y pense.
name: Règles Firestore

# ⚠️ MANUEL UNIQUEMENT. Ce workflow installe firebase-tools et demarre un
# emulateur : environ 16 minutes de runner par execution. Le 06/08 il s'est
# declenche deux fois dans la journee, pendant que les deploiements se mettaient
# a etre annules puis a ne plus demarrer du tout — symptomes typiques de minutes
# Actions epuisees. Faute de preuve, on ne prend pas le risque : ces tests se
# lancent en local (`npm run test:rules`, gratuit) et ici a la demande.
on:
  workflow_dispatch:

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - run: npm run test:rules
